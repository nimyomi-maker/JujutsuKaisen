    $('home-button').onclick=()=>{if(current==='lock')show('passcode');else if(current==='app-view')show('home')};
    document.addEventListener('click',e=>{const app=e.target.closest('[data-app]');if(app){$('app-view').classList.toggle('safari-app-view',app.dataset.app==='safari')}});document.addEventListener('click',e=>{if(e.target.closest('[data-chat]'))setTimeout(()=>{const messages=document.querySelector('.chat-messages');if(messages)messages.scrollTop=messages.scrollHeight},0)});
    document.addEventListener('click',function(e){var chat=e.target.closest('[data-chat]');if(!chat)return;var thread=messageThreads[Number(chat.getAttribute('data-chat'))];if(!thread||!thread.group)return;setTimeout(function(){var bubbles=document.querySelectorAll('.chat-bubble');thread.messages.forEach(function(item,index){var bubble=bubbles[index];if(!bubble)return;var label=document.createElement('span');label.className='group-sender';label.textContent=item[1];bubble.parentNode.insertBefore(label,bubble);});},0)});
    updateDateTime(); window.setInterval(updateDateTime,1000); layoutScreen(); window.addEventListener('resize',layoutScreen);
    document.addEventListener('click',function(e){var app=e.target.closest('[data-app="safari"]');if(app){setTimeout(renderSafari,0);return}var search=e.target.closest('#safari-search');if(search){var page=search.closest('.safari-page');if(page)page.classList.toggle('recent-open');return}var recent=e.target.closest('[data-safari-term]');if(recent){var holder=recent.closest('.safari-page');var input=holder&&holder.querySelector('#safari-search');if(input)input.value=safariRecent[Number(recent.dataset.safariTerm)];if(holder)holder.classList.remove('recent-open')}});
    document.addEventListener('click',function(e){var day=e.target.closest('[data-calendar-day]');if(!day)return;calendarDay=Number(day.getAttribute('data-calendar-day'));setTimeout(function(){var events=document.querySelector('.calendar-events');if(events)events.innerHTML=calendarEventList(calendarYear,calendarMonth)},0)});
    document.addEventListener('click',function(e){var yearButton=e.target.closest('[data-calendar-year]');if(yearButton&&calendarYear===2011)setTimeout(startCalendarReveal,0)});
    document.addEventListener('click',function(e){var notes=e.target.closest('[data-app="notes"]');if(notes){setTimeout(function(){$('app-view').classList.add('notes-app-view');renderNotes()},0);return}var note=e.target.closest('[data-note-index]');if(note){$('app-view').classList.add('notes-app-view');renderNotesDetail(Number(note.getAttribute('data-note-index')));return}var back=e.target.closest('#back-button');if(back&&document.querySelector('.note-detail')){setTimeout(renderNotes,0)}});
    document.addEventListener('click',function(e){var weather=e.target.closest('[data-app="weather"]');if(weather)setTimeout(function(){renderWeather();$('app-view').classList.add('weather-app-view')},0)});
    document.addEventListener('click',function(e){var back=e.target.closest('#back-button');if(back&&document.querySelector('.photo-detail')){setTimeout(renderPhotoGallery,0)}});
  </script>
</body>
</html>
